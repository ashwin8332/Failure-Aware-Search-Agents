base_model: mistralai/Mistral-7B-Instruct-v0.3
output_dir: ./checkpoints/dpo-failure-aware
data_dir: ./data/preference_pairs

# DPO
beta: 0.1
learning_rate: 5.0e-5
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
max_length: 1024
max_prompt_length: 512
warmup_ratio: 0.1
lr_scheduler_type: cosine
save_steps: 100
eval_steps: 100
logging_steps: 10

# LoRA
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Reward weights (for reference)
reward_weights:
  factuality: 0.5
  calibration: 0.3
  recovery: 0.2

preference_margin_threshold: 0.3
seed: 42
