version: "3.9"

services:
  api:
    build: .
    command: python -m app.main
    ports:
      - "8082:8080"
    environment:
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - ADK_MODEL=${ADK_MODEL:-gemini-2.0-flash}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fasa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fasa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=fasaadmin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/fasa_dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  mcp-server:
    build: .
    command: python mcp_server/search_mcp_server.py
    environment:
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - MCP_RATE_LIMIT_PER_MINUTE=${MCP_RATE_LIMIT_PER_MINUTE:-10}
    stdin_open: true
    tty: true
    restart: unless-stopped

  training:
    build: .
    command: python training/dpo_train.py --epochs 1 --max_samples 10
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    profiles:
      - train

volumes:
  prometheus_data:
  grafana_data:
